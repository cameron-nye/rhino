name: DR secret escrow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal-escrow:
    name: Seal SECRET_STORE_KEY into DR backup bucket
    # Job-level `if` cannot read secrets. A missing credential skips every
    # step so a manual dispatch does not fail.
    runs-on: ${{ vars.CI_RUNNER || 'warp-ubuntu-latest-x64-4x' }}
    timeout-minutes: 10
    env:
      DR_ESCROW_CONFIGURED: >-
        ${{ secrets.SECRET_STORE_KEY != '' && secrets.SECRET_ESCROW_PASSPHRASE
        != '' && secrets.DR_BACKUP_ACCOUNT_ID != '' &&
        secrets.DR_BACKUP_BUCKET_NAME != '' && secrets.DR_BACKUP_ACCESS_KEY_ID
        != '' && secrets.DR_BACKUP_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Skip when DR escrow credentials are absent
        if: env.DR_ESCROW_CONFIGURED != 'true'
        run: >-
          echo "Skipping DR secret escrow: SECRET_STORE_KEY,
          SECRET_ESCROW_PASSPHRASE, or DR_BACKUP_* is unset."

      - name: Checkout
        if: env.DR_ESCROW_CONFIGURED == 'true'
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        if: env.DR_ESCROW_CONFIGURED == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        if: env.DR_ESCROW_CONFIGURED == 'true'
        run: npm ci

      - name: Seal and upload escrow blob
        if: env.DR_ESCROW_CONFIGURED == 'true'
        env:
          ESCROW_SECRET_VALUE: ${{ secrets.SECRET_STORE_KEY }}
          ESCROW_PASSPHRASE: ${{ secrets.SECRET_ESCROW_PASSPHRASE }}
          ESCROW_LABEL: secret-store-key
          DR_BACKUP_ACCOUNT_ID: ${{ secrets.DR_BACKUP_ACCOUNT_ID }}
          DR_BACKUP_BUCKET_NAME: ${{ secrets.DR_BACKUP_BUCKET_NAME }}
          DR_BACKUP_ACCESS_KEY_ID: ${{ secrets.DR_BACKUP_ACCESS_KEY_ID }}
          DR_BACKUP_SECRET_ACCESS_KEY:
            ${{ secrets.DR_BACKUP_SECRET_ACCESS_KEY }}
        run: node tools/disaster-recovery/seal-escrow.ts
